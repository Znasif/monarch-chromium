<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Alice's Adventures in Wonderland</title>
</head>
<body>
  <!-- OpenStax logo and UI icon to skip -->
  <nav>
    <img src="openstax-logo.svg" alt="OpenStax logo" class="openstax-logo" width="120" height="30">
    <img src="ui-icon-search.svg" alt="" class="ui-icon" width="20" height="20">
  </nav>

  <!-- Gutenberg Drop-Cap Paragraph: single-letter alt="A" image before "lice" -->
  <section id="gutenberg-section">
    <p id="opening-para"><img src="images/a.png" alt="A" width="70" height="70" class="dropcap">lice was beginning to get very tired of sitting by her sister on the bank.</p>

    <img id="caterpillar-img" src="images/p0050-insert2.jpg" width="337" height="500" alt="Advice from a Caterpillar">
    <img id="cheshire-img" src="images/p0075-image.png" width="400" height="258" alt="Cheshire cat in a tree">
  </section>

  <!-- OpenStax Textbook Figure: concise <figcaption> + long full-description alt text -->
  <section id="openstax-section">
    <figure id="fig-40-11">
      <img
        id="openstax-heart-img"
        src="fig40_11.webp"
        width="520"
        height="640"
        alt="Illustration A shows a cross section of the human heart with the superior vena cava, inferior vena cava, aorta, pulmonary artery, right atrium, right ventricle, left atrium, and left ventricle labeled in detail, along with an inset magnifying the pericardium, epicardium, myocardium, and endocardium layers.">
      <figcaption>Figure 40.11 The mammalian heart and blood vessels consist of four chambers and coronary vessels.</figcaption>
    </figure>
  </section>

  <!-- Archive.org-style BookReader single page scan with generic alt + current page indicator -->
  <section id="bookreader-section">
    <span class="BRcurrentpage">Page 8 of 192</span>
    <img id="archive-page-img" src="n34_w800.jpg" width="400" height="600" alt="Book page image" data-page="8">
  </section>

  <!-- Continuous scroll reader (3 loaded pages with generic alt="Page") -->
  <section id="continuous-reader">
    <img id="gb-page-7" src="page7.png" width="400" height="600" alt="Page">
    <img id="gb-page-8" src="page8_PA8.png" width="400" height="600" alt="Page">
    <img id="gb-page-9" src="page9.png" width="400" height="600" alt="Page">
  </section>
</body>
</html>
